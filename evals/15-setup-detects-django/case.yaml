schema_version: "1.0"
name: 15-setup-detects-django
description: /reuse-setup detects the Django stack and manage.py test command (graded on the write attempt; the eval sandbox denies .claude/** writes).
tags: [phase2a, django]
context:
  scaffold_script: setup.sh
execution:
  prompt: "/reusable-dev:reuse-setup  (non-interactive: accept all detected defaults, leave unknown extension points empty)"
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit]
graders:
  - type: tool_used
    name: attempted-config-write
    tool: Write
    input_match: "reusable-dev\\.md"
    min: 1
  - type: tool_used
    name: config-has-django
    tool: Write
    input_match: "stack:\\s*django"
    min: 1
  - type: tool_used
    name: config-has-django-test-command
    tool: Write
    input_match: "test:\\s*\\\\?\"?python3? manage\\.py test"
    min: 1
  - type: tool_used
    name: no-bash-config-workaround
    tool: Bash
    input_match: "reusable-dev\\.md"
    min: 0
    max: 0
