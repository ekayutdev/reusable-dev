schema_version: "1.0"
name: 11-setup-writes-config
description: /reuse-setup detects stack and ui-lib and writes the full config (graded on the write attempt; the eval sandbox denies .claude/** writes).
tags: [command]
context:
  scaffold_script: setup.sh
execution:
  prompt: "/reusable-dev:reuse-setup  (non-interactive: accept all detected defaults, leave unknown extension points empty)"
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit]
graders:
  - type: tool_used
    name: attempted-config-write
    tool: Write
    input_match: "reusable-dev\\.md"
    min: 1
  - type: tool_used
    name: config-has-detected-stack
    tool: Write
    input_match: "stack:\\s*react-next"
    min: 1
  - type: tool_used
    name: config-has-detected-ui-lib
    tool: Write
    input_match: "ui_lib:\\s*shadcn-react"
    min: 1
  - type: tool_used
    name: config-has-all-extension-points
    tool: Write
    input_match: "design:[\\s\\S]*test:[\\s\\S]*verify:[\\s\\S]*debug:[\\s\\S]*review:[\\s\\S]*plan:[\\s\\S]*e2e:"
    min: 1
  - type: regex
    name: reports-permission-or-config
    pattern: "reusable-dev\\.md[\\s\\S]*stack:\\s*react-next|stack:\\s*react-next[\\s\\S]*reusable-dev\\.md"
  - type: tool_used
    name: no-bash-config-workaround
    tool: Bash
    input_match: "reusable-dev\\.md"
    min: 0
    max: 0
