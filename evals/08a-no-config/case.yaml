schema_version: "1.0"
name: 08a-no-config
description: Without config in a non-interactive run, detect values, do not write config, note it exactly, and still do the work.
tags: [behavior, config]
context:
  scaffold_script: setup.sh
execution:
  prompt: "Add a red Delete button to CustomerCard that calls an onDelete prop."
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
graders:
  - type: regex
    name: still-extends-button
    target: { source: file, path: src/components/ui/button.tsx }
    pattern: "(destructive|danger)\\s*:"
  - type: regex
    name: notes-config-not-saved
    pattern: "config not saved[^\\n]*reuse-setup"
    flags: i
  - type: tool_used
    name: no-config-write
    tool: Write
    input_match: "reusable-dev\\.md"
    min: 0
    max: 0
  - type: file_exists
    name: config-file-not-created
    path: .claude/reusable-dev.md
    exists: false
  - type: regex
    name: no-setup-question-in-reply
    pattern: "error_style[^\\n]*\\?"
    match: not_contains
